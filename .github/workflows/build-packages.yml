name: Build Application Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'PyMOL version override (leave empty for auto-detect)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================================================
  # Windows
  # ==========================================================================
  build-windows:
    runs-on: windows-latest
    env:
      CONDA_ENV_NAME: "pymol_pkg"

    steps:
    - uses: actions/checkout@v6

    - name: Set version
      run: |
        if ("${{ inputs.version }}" -ne "") {
          echo "PYMOL_APP_VERSION=${{ inputs.version }}" | Out-File -Append -FilePath $env:GITHUB_ENV
        }

    - name: Install Miniforge
      run: choco install miniforge3

    - name: Add conda to PATH
      run: |
        echo "$env:CONDA" | Out-File -Append -FilePath $env:GITHUB_PATH
        echo "$env:CONDA\Scripts" | Out-File -Append -FilePath $env:GITHUB_PATH

    - name: Set up conda environment
      run: |
        conda init powershell
        conda create --name $env:CONDA_ENV_NAME -c conda-forge -c schrodinger --override-channels `
            python=3.12 `
            pip `
            freetype `
            glew `
            glm `
            libpng `
            libxml2-devel `
            libnetcdf `
            msgpack-c `
            msgpack-cxx `
            numpy `
            pyside6

    - name: Get additional sources
      run: |
        conda activate $env:CONDA_ENV_NAME
        git clone --depth 1 https://github.com/rcsb/mmtf-cpp.git
        Copy-Item -Recurse -Path mmtf-cpp/include/* -Destination "$env:CONDA_PREFIX\Library\include"

    - name: Build PyMOL
      run: |
        conda activate $env:CONDA_ENV_NAME
        pip install -v .

    - name: Install packaging tools
      run: |
        conda activate $env:CONDA_ENV_NAME
        pip install pyinstaller

    - name: Build portable bundle
      run: |
        conda activate $env:CONDA_ENV_NAME
        python packaging/build_package.py

    - name: Upload portable archive
      uses: actions/upload-artifact@v4
      with:
        name: PyMOL-Windows-x86_64
        path: dist/PyMOL-*.zip
        retention-days: 30

  # ==========================================================================
  # macOS (Intel)
  # ==========================================================================
  build-macos:
    runs-on: macos-latest
    env:
      CONDA_ROOT: "/tmp/miniforge"
      CONDA_ENV_NAME: "pymol_pkg"

    steps:
    - uses: actions/checkout@v6

    - name: Set version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "PYMOL_APP_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
        fi

    - name: Download Miniforge
      run: |
        curl -L -o $CONDA_ROOT.sh https://github.com/conda-forge/miniforge/releases/download/24.11.0-0/Miniforge3-MacOSX-x86_64.sh
        bash $CONDA_ROOT.sh -b -p $CONDA_ROOT

    - name: Add conda to PATH
      run: echo "${CONDA_ROOT}/bin" >> "$GITHUB_PATH"

    - name: Set up conda environment
      run: |
        conda create --name $CONDA_ENV_NAME -c conda-forge -c schrodinger --override-channels \
            python=3.12 \
            pip \
            freetype \
            glew \
            glm \
            libpng \
            libxml2-devel \
            libnetcdf \
            msgpack-c \
            msgpack-cxx \
            numpy \
            pyside6

    - name: Get additional sources
      run: |
        source activate $CONDA_ENV_NAME
        git clone --depth 1 https://github.com/rcsb/mmtf-cpp.git
        cp -R mmtf-cpp/include/* ${CONDA_PREFIX}/include/

    - name: Build PyMOL
      run: |
        source activate $CONDA_ENV_NAME
        export MACOSX_DEPLOYMENT_TARGET=12.0
        pip install -v .

    - name: Install packaging tools
      run: |
        source activate $CONDA_ENV_NAME
        pip install pyinstaller

    - name: Build .app bundle and DMG
      run: |
        source activate $CONDA_ENV_NAME
        python packaging/build_package.py --installer

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: PyMOL-macOS-x86_64
        path: dist/PyMOL-*.dmg
        retention-days: 30

  # ==========================================================================
  # macOS (Apple Silicon)
  # ==========================================================================
  build-macos-arm64:
    runs-on: macos-latest
    env:
      CONDA_ROOT: "/tmp/miniforge"
      CONDA_ENV_NAME: "pymol_pkg"

    steps:
    - uses: actions/checkout@v6

    - name: Set version
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          echo "PYMOL_APP_VERSION=${{ inputs.version }}" >> "$GITHUB_ENV"
        fi

    - name: Download Miniforge (ARM64)
      run: |
        curl -L -o $CONDA_ROOT.sh https://github.com/conda-forge/miniforge/releases/download/24.11.0-0/Miniforge3-MacOSX-arm64.sh
        bash $CONDA_ROOT.sh -b -p $CONDA_ROOT

    - name: Add conda to PATH
      run: echo "${CONDA_ROOT}/bin" >> "$GITHUB_PATH"

    - name: Set up conda environment
      run: |
        conda create --name $CONDA_ENV_NAME -c conda-forge -c schrodinger --override-channels \
            python=3.12 \
            pip \
            freetype \
            glew \
            glm \
            libpng \
            libxml2-devel \
            libnetcdf \
            msgpack-c \
            msgpack-cxx \
            numpy \
            pyside6

    - name: Get additional sources
      run: |
        source activate $CONDA_ENV_NAME
        git clone --depth 1 https://github.com/rcsb/mmtf-cpp.git
        cp -R mmtf-cpp/include/* ${CONDA_PREFIX}/include/

    - name: Build PyMOL
      run: |
        source activate $CONDA_ENV_NAME
        export MACOSX_DEPLOYMENT_TARGET=12.0
        pip install -v .

    - name: Install packaging tools
      run: |
        source activate $CONDA_ENV_NAME
        pip install pyinstaller

    - name: Build .app bundle and DMG
      run: |
        source activate $CONDA_ENV_NAME
        python packaging/build_package.py --installer

    - name: Upload DMG
      uses: actions/upload-artifact@v4
      with:
        name: PyMOL-macOS-arm64
        path: dist/PyMOL-*.dmg
        retention-days: 30
